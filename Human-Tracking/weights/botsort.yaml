# BoT-SORT with the ReID encoder selected by legacy_app.py.
tracker_type: botsort
track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.25
track_buffer: 30
match_thresh: 0.8
fuse_score: true
gmc_method: sparseOptFlow
proximity_thresh: 0.5
appearance_thresh: 0.8
# The app enables ReID after installing its encoder.
with_reid: false
model: weights/msmt_sbs_R50-ibn.pth
